[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portscanner-radius-plugin"
version = "1.0.0"
description = "An example external plugin that adds the RADIUS protocol to the portscanner tool"
requires-python = ">=3.11"
dependencies = ["portscanner"]

# This is all any external plugin needs: registering a module under
# the "portscanner.protocols" group — the name before "=" (radius here)
# is the entry point's own name (shown in --list-protocols and in the
# diagnostics of any load error).
[project.entry-points."portscanner.protocols"]
radius = "radius_plugin.detector"

[tool.setuptools.packages.find]
where = ["src"]
